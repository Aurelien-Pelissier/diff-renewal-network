[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diff-renewal-network"
version = "0.1.0"
description = "Differentiable Renewal Networks: Exact Marked-Race Compilation, Sensitivity-Aware Reduction, Conditional Neural Clocks, and Fisher Observation Design in JAX/Diffrax"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "jax>=0.4.38",
    "diffrax>=0.7.0",
    "numpy>=1.26",
    "scipy>=1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "matplotlib>=3.8",
    "sympy>=1.13",
    "pymupdf>=1.24",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
